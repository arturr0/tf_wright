<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digit Recognizer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <style>
        #canvas {
            border: 1px solid black;
            background: white;
        }
    </style>
</head>
<body>
    <h1>Draw a digit</h1>
    <canvas id="canvas" width="280" height="280"></canvas><br>
    <button onclick="predict()">Predict</button>
    <button onclick="clearCanvas()">Clear</button>
    <h2 id="result"></h2>

    <script>
        let model;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        canvas.addEventListener('mousedown', e => {
            isDrawing = true;
            draw(e);
        });

        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        function draw(e) {
            if (!isDrawing) return;
            ctx.lineWidth = 20;
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'black';
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
        }

        async function loadModel() {
            model = await tf.loadLayersModel('/model.json');
            console.log('Model loaded');
        }

        async function predict() {
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let tensor = tf.browser.fromPixels(imgData, 1)
                .mean(2) // convert to grayscale
                .toFloat()
                .div(255.0)
                .reshape([1, 28, 28, 1]); // shape for CNN

            // If the model expects flat input (Dense layers), flatten:
            tensor = tensor.reshape([1, 784]);

            const prediction = model.predict(tensor);
            const output = prediction.argMax(1);
            const predictedValue = (await output.data())[0];

            document.getElementById('result').innerText = `Prediction: ${predictedValue}`;
        }

        loadModel();
    </script>
</body>
</html>
