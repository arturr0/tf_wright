<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNIST Digit Recognition</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <style>
    canvas {
      border: 1px solid black;
      display: block;
      margin: 20px auto;
    }
    #prediction {
      text-align: center;
      font-size: 24px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1 style="text-align:center;">Draw a digit (0-9) on the canvas</h1>
<canvas id="canvas" width="280" height="280"></canvas>
<button id="clearBtn">Clear</button>
<button id="predictBtn">Predict</button>

<div id="prediction"></div>

<script>
  // Drawing setup
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  canvas.width = 784;
  canvas.height = 784;
  canvas.style.width = '280px';
  canvas.style.height = '280px';
  canvas.style.imageRendering = 'pixelated'; // sharp pixel scaling

  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  canvas.addEventListener('mousedown', () => isDrawing = true);
  canvas.addEventListener('mouseup', () => {
    isDrawing = false;
    ctx.beginPath(); // reset path to avoid weird connections
  });
  canvas.addEventListener('mouseout', () => {
    isDrawing = false;
    ctx.beginPath();
  });
  canvas.addEventListener('mousemove', draw);

  function draw(e) {
    if (!isDrawing) return;
    ctx.lineWidth = 2; // thinner line, MNIST-like
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'black';

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    ctx.lineTo((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
  }

  document.getElementById('clearBtn').addEventListener('click', clearCanvas);
  document.getElementById('predictBtn').addEventListener('click', predictCanvas);

  function clearCanvas() {
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.beginPath();
  }

  async function loadModel() {
    // Load the pre-trained MNIST model from TensorFlow.js
    const model = await tf.loadLayersModel('model.json');

    console.log('Pre-trained model loaded');
    return model;
  }

  async function predictCanvas() {
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

  // Invert the colors (white background -> black, black drawing -> white)
  let data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
    let inverted = 255 - avg;
    data[i] = inverted;
    data[i + 1] = inverted;
    data[i + 2] = inverted;
    data[i + 3] = 255; // full opacity
  }

  // Convert image data to tensor
  const input = tf.browser.fromPixels(imgData, 1)
    .toFloat()
    .div(255.0)
    .expandDims(0)  // shape: [1, 784, 784, 1]
    .squeeze();     // Remove the last dimension to make the shape [1, 784, 784]

  const model = await loadModel();

  // Predict the drawn digit
  const prediction = model.predict(input);
  const pred = prediction.argMax(1);
  const result = (await pred.data())[0];

  // Display prediction result
  document.getElementById('prediction').innerText = `Prediction: ${result}`;

  // Dispose tensors to free memory
  input.dispose();
  prediction.dispose();
  pred.dispose();
}

</script>

</body>
</html>
