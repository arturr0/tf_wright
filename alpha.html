<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grid Draw</title>
  <!-- <link rel="stylesheet" href="style.css"> -->
  <style>
    body {
  margin: 0;
  background-color: #1e1e1e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

#grid {
  display: grid;
  grid-template-columns: repeat(40, 30px);
  grid-template-rows: repeat(20, 30px);
  gap: 1px;
  background-color: #323232;
}

.cell {
  width: 30px;
  height: 30px;
  background-color: #1e1e1e;
  border: 1px solid #323232;
}

.cell.highlighted {
  background-color: #00c864;
}

  </style>
</head>
<body>
  <div id="grid"></div>
  <!-- <script src="script.js"></script> -->
  <script>
    const ROWS = 20;
const COLS = 40;
const grid = document.getElementById('grid');
let mouseDown = false;

// Create grid
const cells = [];
for (let r = 0; r < ROWS; r++) {
  cells[r] = [];
  for (let c = 0; c < COLS; c++) {
    const cell = document.createElement('div');
    cell.classList.add('cell');
    cell.dataset.row = r;
    cell.dataset.col = c;
    grid.appendChild(cell);
    cells[r][c] = cell;

    cell.addEventListener('mouseenter', () => {
      if (mouseDown) cell.classList.add('highlighted');
    });

    cell.addEventListener('mousedown', () => {
      cell.classList.add('highlighted');
    });
  }
}

document.body.addEventListener('mousedown', () => mouseDown = true);
document.body.addEventListener('mouseup', () => mouseDown = false);

// Log highlighted cells on Enter
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const highlighted = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (cells[r][c].classList.contains('highlighted')) {
          highlighted.push({ row: r, col: c });
        }
      }
    }

    console.clear();
    console.log("Highlighted cells:");
    highlighted.forEach(({ row, col }) => {
      console.log(`Row ${row}, Col ${col}`);
    });
    console.log('-'.repeat(30));
  }
});

  </script>
</body>
</html>
