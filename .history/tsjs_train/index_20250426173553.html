<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MNIST Digit Trainer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis@latest"></script>
  <script type="module" src="script.js"></script>
  <style>
    canvas {
      border: 1px solid #000;
      margin-top: 10px;
    }
    #controls {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Train MNIST Digit Classifier</h1>
  <button id="train">Train Model</button>
  <button id="save">Save Model</button>
  <div id="training-status"></div>
  <h2>Draw a Digit</h2>
  <canvas id="canvas" width="280" height="280"></canvas>
  <div id="controls">
    <button id="clear">Clear</button>
    <button id="predict">Predict</button>
  </div>
  <p id="result">Draw a digit and click Predict</p>
</body>
</html>
